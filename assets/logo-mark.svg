  <circle cx="53" cy="31.5" r="8.5" fill="url(#nm-bell)"/>
  <circle cx="53" cy="31.5" r="8.5" fill="none" stroke="#0A2E33" stroke-width="2"/>
  <path d="M51.6 27.3h2.8v2.8h2.8v2.8h-2.8v2.8h-2.8v-2.8h-2.8v-2.8h2.8z" fill="#FFF8EC"/>
