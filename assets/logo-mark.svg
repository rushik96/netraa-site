      <stop offset="0" stop-color="#14605B"/>
      <stop offset="1" stop-color="#0A2E33"/>
    </linearGradient>
    <radialGradient id="nm-bell" cx=".38" cy=".35" r=".8">
      <stop offset="0" stop-color="#FFC94A"/>
      <stop offset=".6" stop-color="#F29A1F"/>
